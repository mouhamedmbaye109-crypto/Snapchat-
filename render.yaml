services:
  - type: web
    name: fishing
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 --threads 4 -b 0.0.0.0:$PORT "app:app"
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CODE_ACCES
        value: change-ce-code
      - key: PUBLIC_URL
        value: https://snapchat-3p7x.onrender.com
      - key: DATABASE_URL
        sync: false